# Local stack (scripts/local-up.sh): the adapter and the two mock model servers.
global:
  scrape_interval: 5s
scrape_configs:
- job_name: switchyard-adapter
  static_configs:
  - targets: ["127.0.0.1:9480"]
- job_name: model-servers
  # mock-llm exports vLLM-named gauges. They are simulated (slots in use), not GPU data.
  static_configs:
  - targets: ["127.0.0.1:9481"]
    labels: {pool: small}
  - targets: ["127.0.0.1:9482"]
    labels: {pool: large}
