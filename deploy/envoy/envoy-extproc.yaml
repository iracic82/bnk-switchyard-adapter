# Local stand-in for a gateway with a model-router ext_proc slot (as BNK's AI gateway has).
# Envoy sends each request's headers and buffered body to the adapter's ext_proc server,
# then routes on the x-selected-model header the adapter sets. A request that was not
# decided matches no model route and gets 404, so a passing test proves the decision,
# the body rewrite and the route re-match all happened.
#   docker run --rm --network host -v $PWD/deploy/envoy/envoy-extproc.yaml:/etc/envoy/envoy.yaml envoyproxy/envoy:v1.36-latest -c /etc/envoy/envoy.yaml --disable-hot-restart
admin:
  address: {socket_address: {address: 127.0.0.1, port_value: 9471}}
static_resources:
  listeners:
  - name: gateway
    address: {socket_address: {address: 127.0.0.1, port_value: 9470}}
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: gateway
          route_config:
            virtual_hosts:
            - name: models
              domains: ["*"]
              routes:
              - match: {prefix: "/", headers: [{name: x-selected-model, string_match: {exact: mock-small}}]}
                route: {cluster: small, timeout: 120s}
              - match: {prefix: "/", headers: [{name: x-selected-model, string_match: {exact: mock-large}}]}
                route: {cluster: large, timeout: 120s}
              - match: {prefix: "/"}
                direct_response: {status: 404, body: {inline_string: "no model selected\n"}}
          http_filters:
          - name: envoy.filters.http.ext_proc
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExternalProcessor
              grpc_service:
                envoy_grpc: {cluster_name: switchyard_extproc}
                timeout: 20s
              message_timeout: 20s
              failure_mode_allow: false
              processing_mode:
                request_header_mode: SEND
                response_header_mode: SKIP
                request_body_mode: BUFFERED
                response_body_mode: NONE
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
  - name: switchyard_extproc
    type: STATIC
    typed_extension_protocol_options:
      envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
        "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
        explicit_http_config: {http2_protocol_options: {}}
    load_assignment:
      cluster_name: switchyard_extproc
      endpoints: [{lb_endpoints: [{endpoint: {address: {socket_address: {address: 127.0.0.1, port_value: 9450}}}}]}]
  - name: small
    type: STATIC
    load_assignment:
      cluster_name: small
      endpoints: [{lb_endpoints: [{endpoint: {address: {socket_address: {address: 127.0.0.1, port_value: 9481}}}}]}]
  - name: large
    type: STATIC
    load_assignment:
      cluster_name: large
      endpoints: [{lb_endpoints: [{endpoint: {address: {socket_address: {address: 127.0.0.1, port_value: 9482}}}}]}]
