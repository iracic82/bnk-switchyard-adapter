# Two model pools, two replicas each, no GPU. The small pool runs mock-llm, which also answers
# the classifier's judge calls; the large pool runs llm-d's vLLM simulator. Both serve real
# Hugging Face model names so the F5EPP can load a matching tokenizer. They are NOT those models.
# For real vLLM on GPUs, apply deploy/k8s/models-real/ instead of this file.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: small-model
  namespace: inference
spec:
  replicas: 2
  selector:
    matchLabels: {app: small-model}
  template:
    metadata:
      labels:
        app: small-model
        inference.switchyard.dev/pool: small
    spec:
      automountServiceAccountToken: false
      containers:
      - name: server
        image: mock-llm:dev
        imagePullPolicy: IfNotPresent
        ports:
        - {name: http, containerPort: 8000}
        env:
        - {name: MOCK_MODEL, value: "Qwen/Qwen3-0.6B"}
        - {name: MOCK_PROFILE, value: small}
        # The small pool also serves the classifier's judge calls. Simulated judge error rate.
        - {name: MOCK_JUDGE_ERROR_RATE, value: "0.1"}
        - {name: MOCK_SLOTS, value: "8"}
        - name: MOCK_POD
          valueFrom: {fieldRef: {fieldPath: metadata.name}}
        readinessProbe:
          httpGet: {path: /health, port: http}
        resources:
          requests: {cpu: 100m, memory: 32Mi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: large-model
  namespace: inference
spec:
  replicas: 2
  selector:
    matchLabels: {app: large-model}
  template:
    metadata:
      labels:
        app: large-model
        inference.switchyard.dev/pool: large
    spec:
      automountServiceAccountToken: false
      containers:
      # The large pool runs llm-d's vLLM simulator, the one the Gateway API Inference Extension
      # community tests endpoint pickers with: vLLM's API and metrics, a real request queue
      # (max-num-seqs running, the rest waiting) and per-token latency that grows under load.
      # Its answers are filler text, so benchmarks simulate task success for it (bench/workload.py).
      - name: server
        image: ghcr.io/llm-d/llm-d-inference-sim:v1.0.0
        imagePullPolicy: IfNotPresent
        args:
        - --model=Qwen/Qwen3-32B
        - --port=8000
        - --max-num-seqs=4
        - --max-model-len=4096
        - --time-to-first-token=400ms
        - --time-to-first-token-std-dev=80ms
        - --inter-token-latency=25ms
        - --inter-token-latency-std-dev=5ms
        - --time-factor-under-load=1.5
        ports:
        - {name: http, containerPort: 8000}
        readinessProbe:
          httpGet: {path: /health, port: http}
        resources:
          requests: {cpu: 100m, memory: 64Mi}
---
# Plain Services for the model pods. BNK routes answers through the InferencePools; these are for
# the adapter's judge call and for gateways that address a model server directly.
apiVersion: v1
kind: Service
metadata:
  name: small-model
  namespace: inference
spec:
  selector: {app: small-model}
  ports:
  - {name: http, port: 8000, targetPort: http}
---
apiVersion: v1
kind: Service
metadata:
  name: large-model
  namespace: inference
spec:
  selector: {app: large-model}
  ports:
  - {name: http, port: 8000, targetPort: http}
