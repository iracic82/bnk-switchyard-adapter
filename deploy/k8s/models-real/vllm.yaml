# Optional: real vLLM model servers on NVIDIA GPUs, replacing base/20-model-servers.yaml.
# Not tested in this repository (no GPUs here). Requires the NVIDIA GPU Operator or device
# plugin, so that `nvidia.com/gpu` is schedulable.
#
# Labels match the InferencePool selectors in base/30-inference-pools.yaml. The served model
# names match the F5EPP tokenizer names. KV-cache events are published over ZMQ so the F5EPP
# can use precise prefix-cache scoring; with real vLLM, remove the zmq-wire delete patch
# from base/31-f5epp.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: small-model
  namespace: inference
spec:
  replicas: 2
  selector:
    matchLabels: {app: small-model}
  template:
    metadata:
      labels: {app: small-model}
    spec:
      containers:
      - name: vllm
        image: vllm/vllm-openai:v0.11.0
        args:
        - --model=Qwen/Qwen3-0.6B
        - --port=8000
        - --max-model-len=8192
        - --enable-prefix-caching
        - --kv-events-config={"enable_kv_cache_events":true,"publisher":"zmq","endpoint":"tcp://*:5557","topic":"kv-events"}
        ports:
        - {name: http, containerPort: 8000}
        readinessProbe:
          httpGet: {path: /health, port: http}
          initialDelaySeconds: 30
          periodSeconds: 10
        resources:
          limits: {nvidia.com/gpu: 1}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: large-model
  namespace: inference
spec:
  replicas: 2
  selector:
    matchLabels: {app: large-model}
  template:
    metadata:
      labels: {app: large-model}
    spec:
      containers:
      - name: vllm
        image: vllm/vllm-openai:v0.11.0
        args:
        - --model=Qwen/Qwen3-32B
        - --port=8000
        - --tensor-parallel-size=2
        - --max-model-len=16384
        - --enable-prefix-caching
        - --kv-events-config={"enable_kv_cache_events":true,"publisher":"zmq","endpoint":"tcp://*:5557","topic":"kv-events"}
        ports:
        - {name: http, containerPort: 8000}
        readinessProbe:
          httpGet: {path: /health, port: http}
          initialDelaySeconds: 120
          periodSeconds: 15
        resources:
          limits: {nvidia.com/gpu: 2}
