title: 'Right model, right GPU: NVIDIA Switchyard on F5 BIG-IP Next for Kubernetes'
teaser: NVIDIA Switchyard picks the model for each agent step. BNK's endpoint picker
  picks the GPU replica. Tenant policy decides who may use which model.
description: |-
  An agent task is a chain of steps and most of them are easy. Pin one big model and every
  "format this as JSON" step queues on your most expensive GPUs. Pin a small model and the
  hard steps fail.

  This lab runs NVIDIA NeMo Switchyard on a live BIG-IP Next for Kubernetes 2.4 cluster, as
  the model router of BNK's AI gateway. A caller sends `model: auto` with a virtual key. The
  gateway checks the key's scope and budget, Switchyard's task classifier picks the model, and
  the F5 Endpoint Picker picks the replica inside that model's InferencePool.

  1. **Two decisions.** Watch Switchyard choose the model and the picker choose the pod.
  2. **From model name to GPU pod.** Follow one request from the gateway to the pod, and see
     the picker spread load.
  3. **Who may use which model.** Virtual keys, model scopes and a token budget that runs out.
  4. **The cost of a decision.** Run the same agent workload three ways and compare task
     success and cost per successful task.
  5. **Tune the judge.** One threshold decides how often a step escalates. Sweep it through
     the gateway and find where cost per completed task bottoms out.
  6. **A Dynamo pool behind the same picker.** NVIDIA Dynamo as a third model: Switchyard
     picks it, F5's picker reads Dynamo's KV events on NATS and names the worker.

  There are no GPUs: the large model pool runs llm-d's vLLM simulator, the small pool a
  mock that also plays the judge, and the Dynamo pool runs Dynamo's Mocker workers on nodes
  with simulated H100s. All of them publish vLLM's metrics to the F5 picker. Every
  number the lab shows says whether it is simulated.
